  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    function formatEuro(amount) {
      return euroFormatter.format(amount);

    function getWeeklyDrawCount(product, referenceDate = new Date()) {
      const day = referenceDate.getDay();
      if (product === &#x27;2&#x27;) {
        return day === 0 ? 1 : 8 - day;
      }
      if (day === 0) return 0;
      return [1, 4, 6].filter((drawDay) =&gt; drawDay &gt;= day).length;
    }

    function getQrCostDetails(combinationCount) {
      const product = gameSelect.value;
      const isPrimitiva = product === &#x27;1&#x27;;
      const combinationPrice = isPrimitiva ? 1 : 0.5;
      const jokerPrice = isPrimitiva &amp;&amp; jokerSelect.value === &#x27;0&#x27; ? 1 : 0;
      const drawCount = periodSelect.value === &#x27;1&#x27; ? getWeeklyDrawCount(product) : 1;
      const pricePerDraw = combinationCount * combinationPrice + jokerPrice;
      return {
        combinationCount,
        combinationPrice,
        jokerPrice,
        drawCount,
        pricePerDraw,
        total: pricePerDraw * drawCount
      };
    }

    function updateQrCost() {
      if (costSelect.value !== &#x27;1&#x27; || qrPages.length === 0 || qrArea.hidden) {
        qrCostSummary.hidden = true;
        return;
      }

      const currentPage = qrPages[qrPageIndex];
      const details = getQrCostDetails(currentPage.combinations.length);
      const combinationLabel = details.combinationCount === 1 ? &#x27;combinación&#x27; : &#x27;combinaciones&#x27;;
      const jokerText = details.jokerPrice &gt; 0 ? ` + Joker ${formatEuro(details.jokerPrice)}` : &#x27;&#x27;;
      const baseText = `${details.combinationCount} ${combinationLabel} × ${formatEuro(details.combinationPrice)}${jokerText} = ${formatEuro(details.pricePerDraw)} por sorteo`;

      qrCostAmount.textContent = formatEuro(details.total);
      if (periodSelect.value === &#x27;1&#x27;) {
        if (details.drawCount === 0) {
          qrCostBreakdown.textContent = `${baseText}. No quedan sorteos de La Primitiva en la semana actual.`;
        } else {
          const drawLabel = details.drawCount === 1 ? &#x27;sorteo pendiente&#x27; : &#x27;sorteos pendientes&#x27;;
          qrCostBreakdown.textContent = `${baseText} · ${details.drawCount} ${drawLabel} esta semana, contando hoy cuando corresponda.`;
        }
      } else {
        qrCostBreakdown.textContent = `${baseText} · un único sorteo.`;
      }

      if (qrPages.length &gt; 1) {
        const allQrTotal = qrPages.reduce(
          (total, page) =&gt; total + getQrCostDetails(page.combinations.length).total,
          0

        const jokerNote = gameSelect.value === &#x27;1&#x27; &amp;&amp; jokerSelect.value === &#x27;0&#x27;
          ? &#x27; El importe incluye 1,00 € de Joker por cada QR o boleto.&#x27;

        qrCostAll.textContent = `Total de los ${qrPages.length} códigos QR: ${formatEuro(allQrTotal)}.${jokerNote}`;

        qrCostAll.hidden = true;

          setQrMessage(`Bonoloto preparado con ${total} combinaciones · ${qrTotal} ${qrTotal === 1 ? &#x27;QR&#x27; : &#x27;QRs&#x27;}.`);

      } else if (total === 0) {

      } else {

        setQrMessage(`La Primitiva preparada con ${total} ${total === 1 ? &#x27;combinación&#x27; : &#x27;combinaciones&#x27;} · ${qrTotal} ${qrTotal === 1 ? &#x27;QR&#x27; : &#x27;QRs&#x27;}.`);
      }
    }

      savedCurrent = complete &amp;&amp; savedCombinations.some((combination) =&gt; combinationKey(combination) === currentKey);

      refreshSaveButton();
      updateQrGuidance();
    }

    function saveCurrentCombination() {
      if (drawn.length !== 6 || savedCombinations.length &gt;= 8) return;
      if (savedOrigin === &#x27;rules&#x27;) {
        status.textContent = &#x27;Vacía la lista de fijos y semifijos antes de guardar combinaciones aleatorias.&#x27;;
        return;
      }

      const combination = [...drawn].sort((a, b) =&gt; a - b);
      const key = combinationKey(combination);
      if (savedCombinations.some((saved) =&gt; combinationKey(saved) === key)) {
        status.textContent = &#x27;Esta combinación ya está guardada.&#x27;;
        refreshSaveButton();
        return;
      }

      savedOrigin = &#x27;random&#x27;;
      savedCombinations.push(combination);
      savedPageIndex = Math.max(0, Math.ceil(savedCombinations.length / SAVED_PAGE_SIZE) - 1);
      hideQr();
      renderSavedCombinations();
      const remainingSlots = 8 - savedCombinations.length;
      status.textContent = remainingSlots &gt; 0
        ? `Combinación guardada · ${combination.join(&#x27;, &#x27;)} · pulsa «Nuevo sorteo» para continuar.`
        : `Combinación guardada · ${combination.join(&#x27;, &#x27;)} · lista completa.`;
      summary.textContent = remainingSlots &gt; 0
        ? `Combinación ${savedCombinations.length} guardada. Quedan ${remainingSlots} combinaciones para completar el boleto; el botón Nuevo sorteo está resaltado.`
        : &#x27;Combinación 8 guardada. La lista está completa.&#x27;;
    }

    function removeSavedCombination(index) {
      if (!Number.isInteger(index) || index &lt; 0 || index &gt;= savedCombinations.length) return;
      if (savedOrigin === &#x27;rules&#x27;) {
        ruleGeneratedCombinations.splice(index, 1);
      }
      savedCombinations.splice(index, 1);
      if (savedCombinations.length === 0) savedOrigin = null;
      copyRulesButton.disabled = ruleGeneratedCombinations.length === 0;
      hideQr();
      renderSavedCombinations();
      summary.textContent = `Combinación eliminada. Quedan ${savedCombinations.length} combinaciones guardadas.`;
    }

    function clearSavedCombinations() {
      if (savedOrigin === &#x27;rules&#x27;) ruleGeneratedCombinations = [];
      savedCombinations = [];
      savedOrigin = null;
      savedPageIndex = 0;
      savedCurrent = false;
      copyRulesButton.disabled = ruleGeneratedCombinations.length === 0;
      hideQr();
      renderSavedCombinations();
      summary.textContent = &#x27;Se han eliminado todas las combinaciones guardadas.&#x27;;
    }

    function buildQrText(combinations) {
      const product = gameSelect.value;
      const weekly = periodSelect.value;
      const bets = combinations.map((combination, index) =&gt; `.${index + 1}=${combinationKey(combination)}`).join(&#x27;&#x27;);
      const primitivaFields = product === &#x27;1&#x27; ? `J=${jokerSelect.value};R=${reintegroSelect.value};` : &#x27;&#x27;;
      return `A=1;P=${product};W=${weekly};${bets};${primitivaFields}`;
    }

    function splitQrGroups(combinations) {
      const groups = [];
      const isBonoloto = gameSelect.value === &#x27;2&#x27;;
      let index = 0;

      if (isBonoloto &amp;&amp; combinations.length % 8 === 1 &amp;&amp; combinations.length &gt; 1) {
        while (combinations.length - index &gt; 9) {
          groups.push(combinations.slice(index, index + 8));
          index += 8;
        }
        groups.push(combinations.slice(index, index + 7));
        groups.push(combinations.slice(index + 7, index + 9));
        return groups;
      }

      while (index &lt; combinations.length) {
        groups.push(combinations.slice(index, index + 8));
        index += 8;
      }
      return groups;
    }

    function showQrPage(index) {
      if (qrPages.length === 0) return;

      qrPageIndex = Math.max(0, Math.min(index, qrPages.length - 1));
      const currentPage = qrPages[qrPageIndex];
      qrCode.replaceChildren();
      qrText.value = currentPage.text;
      qrArea.hidden = false;
      qrLabel.textContent = `Código QR ${qrPageIndex + 1} de ${qrPages.length}`;
      const isBonoloto = gameSelect.value === &#x27;2&#x27;;
      const qrGameName = isBonoloto ? &#x27;Bonoloto&#x27; : &#x27;La Primitiva&#x27;;
      qrGame.dataset.game = isBonoloto ? &#x27;bonoloto&#x27; : &#x27;primitiva&#x27;;
      qrGame.title = qrGameName;
      qrGameLogo.src = isBonoloto ? qrGameLogoSources.bonoloto : qrGameLogoSources.primitiva;
      qrGameLogo.alt = `Logotipo de ${qrGameName}`;
      const qrIncludesJoker = !isBonoloto &amp;&amp; currentPage.text.includes(&#x27;;J=0;&#x27;);
      qrJoker.hidden = !qrIncludesJoker;
      if (qrIncludesJoker) {
        qrJokerLogo.src = qrGameLogoSources.joker;
      }
      qrPage.textContent = `QR ${qrPageIndex + 1} de ${qrPages.length}`;
      qrPreviousButton.disabled = qrPageIndex === 0;
      qrNextButton.disabled = qrPageIndex === qrPages.length - 1;
      qrCode.setAttribute(&#x27;aria-label&#x27;, `Código QR ${qrPageIndex + 1} de ${qrPages.length}, con ${currentPage.combinations.length} combinaciones`);

      new QRCode(qrCode, {
        text: currentPage.text,
        width: 280,
        height: 280,
        colorDark: &#x27;#000000&#x27;,
        colorLight: &#x27;#ffffff&#x27;,
        correctLevel: QRCode.CorrectLevel.M
      });

      updateQrCost();
      const costSummary = costSelect.value === &#x27;1&#x27; ? ` Coste estimado: ${qrCostAmount.textContent}.` : &#x27;&#x27;;
      summary.textContent = `Mostrando el código QR ${qrPageIndex + 1} de ${qrPages.length}, con ${currentPage.combinations.length} combinaciones.${costSummary}`;
    }

    function generateQrPages(combinations, source) {
      const total = combinations.length;
      const isBonoloto = gameSelect.value === &#x27;2&#x27;;
      const sourceIsTxt = source === &#x27;txt&#x27;;

      if (total === 0) {
        hideQr();
        if (sourceIsTxt) {
          txtMessage.textContent = &#x27;Selecciona primero un archivo TXT válido.&#x27;;
          txtMessage.classList.add(&#x27;is-error&#x27;);
        } else {
          setQrMessage(&#x27;Guarda al menos una combinación antes de generar el QR.&#x27;, true);
        }
        return;
      }

      if (isBonoloto &amp;&amp; total &lt; 2) {
        hideQr();
        if (sourceIsTxt) {
          txtMessage.textContent = &#x27;Bonoloto necesita al menos 2 combinaciones.&#x27;;
          txtMessage.classList.add(&#x27;is-error&#x27;);
        } else {
          setQrMessage(&#x27;No se puede generar: en Bonoloto el mínimo son 2 combinaciones.&#x27;, true);
        }
        return;
      }

      if (typeof QRCode === &#x27;undefined&#x27;) {
        hideQr();
        const message = &#x27;No se ha podido iniciar el generador QR.&#x27;;
        if (sourceIsTxt) {
          txtMessage.textContent = message;
          txtMessage.classList.add(&#x27;is-error&#x27;);
        } else {
          setQrMessage(message, true);
        }
        return;
      }

      const groups = splitQrGroups(combinations);
      qrPages = groups.map((group) =&gt; ({
        combinations: group,
        text: buildQrText(group)
      }));
      qrPageIndex = 0;
      showQrPage(0);
      scrollToGeneratedQr();

      const gameName = isBonoloto ? &#x27;Bonoloto&#x27; : &#x27;La Primitiva&#x27;;
      const resultMessage = `${total} ${total === 1 ? &#x27;combinación&#x27; : &#x27;combinaciones&#x27;} repartidas en ${qrPages.length} ${qrPages.length === 1 ? &#x27;código QR&#x27; : &#x27;códigos QR&#x27;}.`;
      if (sourceIsTxt) {
        txtMessage.textContent = `${gameName}: ${resultMessage}`;
        txtMessage.classList.remove(&#x27;is-error&#x27;);
      } else {
        setQrMessage(`${gameName}: ${resultMessage}`);
      }
      summary.textContent = `${gameName}: ${resultMessage}`;
    }

    function generateQr() {
      generateQrPages(savedCombinations, &#x27;saved&#x27;);
    }

    function generateTxtQr() {
      generateQrPages(importedCombinations, &#x27;txt&#x27;);
    }

    function combinationsToClipboardText(combinations) {
      return combinations
        .map((combination) =&gt; combination.map((number) =&gt; String(number).padStart(2, &#x27;0&#x27;)).join(&#x27; &#x27;))
        .join(&#x27;\r\n&#x27;);
    }

    function findClipboard() {
      try {
        if (window.top?.navigator?.clipboard?.writeText) return window.top.navigator.clipboard;
      } catch (error) {
        // El entorno puede impedir el acceso a la ventana superior.
      }
      return window.navigator?.clipboard?.writeText ? window.navigator.clipboard : null;
    }

    function findReadableClipboard() {
      try {
        if (window.top?.navigator?.clipboard?.readText) return window.top.navigator.clipboard;
      } catch (error) {
        // El entorno puede impedir el acceso a la ventana superior.
      }
      return window.navigator?.clipboard?.readText ? window.navigator.clipboard : null;
    }

    async function copyTextToClipboard(text) {
      const clipboard = findClipboard();
      if (clipboard) {
        try {
          await clipboard.writeText(text);
          return { copied: true };
        } catch (error) {
          // Se intenta el método compatible con páginas locales.
        }
      }

      const textArea = document.createElement(&#x27;textarea&#x27;);
      textArea.className = &#x27;sr-only&#x27;;
      textArea.value = text;
      textArea.setAttribute(&#x27;readonly&#x27;, &#x27;&#x27;);
      textArea.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
      document.body.appendChild(textArea);
      textArea.select?.();
      textArea.setSelectionRange?.(0, text.length);

      let copied = false;
      try {
        copied = typeof document.execCommand === &#x27;function&#x27; &amp;&amp; document.execCommand(&#x27;copy&#x27;);
      } catch (error) {
        copied = false;
      }
      textArea.remove();
      if (copied) return { copied: true };

      if (typeof window.prompt === &#x27;function&#x27;) {
        window.prompt(&#x27;Copia estas combinaciones y pégalas en un archivo TXT&#x27;, text);
        return { manual: true };
      }
      return { error: true };
    }

    async function copyRandomCombinations() {
      const combinations = savedOrigin === &#x27;random&#x27; &amp;&amp; savedCombinations.length &gt; 0
        ? savedCombinations
        : savedOrigin === null &amp;&amp; drawn.length === 6
          ? [[...drawn].sort((first, second) =&gt; first - second)]
          : [];

      if (combinations.length === 0) {
        status.textContent = &#x27;Genera o guarda primero al menos una combinación aleatoria.&#x27;;
        return;
      }

      const result = await copyTextToClipboard(combinationsToClipboardText(combinations));
      if (result.copied) {
        status.textContent = `${combinations.length} ${combinations.length === 1 ? &#x27;combinación aleatoria copiada&#x27; : &#x27;combinaciones aleatorias copiadas&#x27;} al portapapeles.`;
        summary.textContent = `${combinations.length} combinaciones aleatorias copiadas, una por línea.`;
      } else if (result.manual) {
        status.textContent = &#x27;El navegador ha mostrado las combinaciones para copiarlas manualmente.&#x27;;
      } else if (result.error) {
        status.textContent = &#x27;No se han podido copiar las combinaciones.&#x27;;
      }
    }

    async function copyRuleCombinations() {
      if (ruleGeneratedCombinations.length === 0) {
        setRuleMessage(&#x27;Genera primero las combinaciones con fijos o semifijos.&#x27;, true);
        return;
      }

      const result = await copyTextToClipboard(combinationsToClipboardText(ruleGeneratedCombinations));
      if (result.copied) {
        setRuleMessage(`${ruleGeneratedCombinations.length} combinaciones copiadas al portapapeles, una por línea.`);
        summary.textContent = `${ruleGeneratedCombinations.length} combinaciones de fijos y semifijos copiadas.`;
      } else if (result.manual) {
        setRuleMessage(&#x27;El navegador ha mostrado las combinaciones para copiarlas manualmente.&#x27;);
      } else if (result.error) {
        setRuleMessage(&#x27;No se han podido copiar las combinaciones.&#x27;, true);
      }
    }

    function setRuleMessage(message, isError = false) {
      ruleMessage.textContent = message;
      ruleMessage.classList.toggle(&#x27;is-error&#x27;, isError);
    }

    function setTxtMessage(message, isError = false) {
      txtMessage.textContent = message;
      txtMessage.classList.toggle(&#x27;is-error&#x27;, isError);
    }

    function populateRuleNumbers() {
      ruleNumberSelect.replaceChildren();
      for (let number = 1; number &lt;= 49; number += 1) {
        const option = document.createElement(&#x27;option&#x27;);
        option.value = String(number);
        option.textContent = String(number).padStart(2, &#x27;0&#x27;);
        ruleNumberSelect.appendChild(option);
      }
    }

    function getRuleCombinationTotal() {
      const total = Math.trunc(Number(ruleTotalSelect.value));
      return Number.isInteger(total) ? Math.min(100, Math.max(1, total)) : 8;
    }

    function combinationCountLabel(total) {
      return `${total} ${total === 1 ? &#x27;combinación&#x27; : &#x27;combinaciones&#x27;}`;
    }

    function getRulePositionStats() {
      const combinationTotal = getRuleCombinationTotal();
      const total = combinationTotal * 6;
      const fixed = numberRules.filter((rule) =&gt; rule.type === &#x27;fixed&#x27;).length * combinationTotal;
      const semi = numberRules
        .filter((rule) =&gt; rule.type === &#x27;semi&#x27;)
        .reduce((sum, rule) =&gt; sum + rule.appearances, 0);
      const occupied = fixed + semi;
      return {
        combinationTotal,
        total,
        fixed,
        semi,
        occupied,
        remaining: Math.max(0, total - occupied),
        excess: Math.max(0, occupied - total)
      };
    }

    function updateRulePositionSummary() {
      const positions = getRulePositionStats();
      const fixedWidth = positions.total &gt; 0 ? Math.min(100, positions.fixed / positions.total * 100) : 0;
      const semiWidth = positions.total &gt; 0
        ? Math.min(100 - fixedWidth, positions.semi / positions.total * 100)
        : 0;

      rulePositionTotal.textContent = String(positions.total);
      rulePositionFixed.textContent = String(positions.fixed);
      rulePositionSemi.textContent = String(positions.semi);
      rulePositionRemainingWrap.firstChild.textContent = positions.excess
        ? (positions.excess === 1 ? &#x27;Sobra &#x27; : &#x27;Sobran &#x27;)
        : &#x27;Por cubrir &#x27;;
      rulePositionRemaining.textContent = String(positions.excess || positions.remaining);
      rulePositionFixedBar.style.width = `${fixedWidth}%`;
      rulePositionSemiBar.style.width = `${semiWidth}%`;
      rulePositionSummary.classList.toggle(&#x27;has-excess&#x27;, positions.excess &gt; 0);
      rulePositionNote.classList.toggle(&#x27;is-error&#x27;, positions.excess &gt; 0);

      if (positions.excess &gt; 0) {
        rulePositionNote.textContent = positions.excess === 1
          ? &#x27;Sobra 1 posición entre los criterios seleccionados. Reduce fijos o apariciones de semifijos.&#x27;
          : `Sobran ${positions.excess} posiciones entre los criterios seleccionados. Reduce fijos o apariciones de semifijos.`;
      } else if (positions.occupied === 0) {
        rulePositionNote.textContent = `Las ${positions.total} posiciones se completarán aleatoriamente.`;
      } else if (positions.remaining === 0) {
        rulePositionNote.textContent = `Los criterios ocupan exactamente las ${positions.total} posiciones; no quedan huecos aleatorios.`;
      } else {
        rulePositionNote.textContent = `${positions.occupied} posiciones quedan definidas y ${positions.remaining} se completarán aleatoriamente.`;
      }

      rulePositionTrack.setAttribute(
        &#x27;aria-label&#x27;,
        positions.excess
          ? `Los criterios exceden en ${positions.excess} las ${positions.total} posiciones disponibles`
          : `${positions.occupied} de ${positions.total} posiciones ocupadas por los criterios`
      );
    }

    function updateRuleQuantityControls() {
      const total = getRuleCombinationTotal();
      const fixedOption = ruleTypeSelect.querySelector(&#x27;option[value=&quot;fixed&quot;]&#x27;);
      fixedOption.textContent = `Fijo · ${total} ${total === 1 ? &#x27;vez&#x27; : &#x27;veces&#x27;}`;
      generateTicketButton.textContent = `Generar ${combinationCountLabel(total)}`;
      ruleFrequencySelect.max = String(total);
      const requestedFrequency = Math.trunc(Number(ruleFrequencySelect.value));
      const preferredFrequency = Number.isInteger(requestedFrequency)
        ? Math.min(Math.max(1, requestedFrequency), total)
        : Math.max(1, Math.ceil(total / 2));
      ruleFrequencySelect.value = String(preferredFrequency);
      updateRulePositionSummary();
    }

    function updateRuleTypeControl() {
      ruleFrequencyWrap.hidden = ruleTypeSelect.value !== &#x27;semi&#x27;;
    }

    function assessRuleConfiguration() {
      const total = getRuleCombinationTotal();
      const fixedRules = numberRules.filter((rule) =&gt; rule.type === &#x27;fixed&#x27;);
      const semiRules = numberRules.filter((rule) =&gt; rule.type === &#x27;semi&#x27;);
      const positions = getRulePositionStats();

      if (numberRules.length === 0) {
        return {
          valid: false,
          message: `Añade al menos un número fijo o semifijo para generar ${combinationCountLabel(total)}.`
        };
      }

      if (positions.excess &gt; 0) {
        return {
          valid: false,
          message: positions.excess === 1
            ? &#x27;Sobra 1 posición entre los criterios seleccionados. Reduce fijos o apariciones de semifijos.&#x27;
            : `Sobran ${positions.excess} posiciones entre los criterios seleccionados. Reduce fijos o apariciones de semifijos.`
        };
      }

      if (fixedRules.length &gt; 6) {
        return { valid: false, message: &#x27;No puede haber más de 6 números fijos por combinación.&#x27; };
      }

      if (fixedRules.length === 6 &amp;&amp; total &gt; 1) {
        return {
          valid: false,
          message: `Con 6 números fijos solo se puede crear 1 combinación; ${total} resultarían idénticas.`
        };
      }

      if (semiRules.some((rule) =&gt; !Number.isInteger(rule.appearances) || rule.appearances &lt; 1 || rule.appearances &gt; total)) {
        return {
          valid: false,
          message: `Una frecuencia de semifijo no puede superar las ${combinationCountLabel(total)} seleccionadas.`
        };
      }

      const variableSemiRules = semiRules.filter((rule) =&gt; rule.appearances &lt; total);
      if (variableSemiRules.length === 0) {
        const requiredCount = fixedRules.length + semiRules.length;
        const randomPoolSize = 49 - numberRules.length;
        const distinctCapacity = limitedCombinationCount(randomPoolSize, 6 - requiredCount);
        if (distinctCapacity &lt; total) {
          return {
            valid: false,
            message: `Estas reglas solo permiten ${distinctCapacity} ${distinctCapacity === 1 ? &#x27;combinación distinta&#x27; : &#x27;combinaciones distintas&#x27;}; reduce la cantidad o cambia los criterios.`
          };
        }
      }

      const rowCapacity = 6 - fixedRules.length;
      const totalAppearances = semiRules.reduce((sum, rule) =&gt; sum + rule.appearances, 0);
      if (totalAppearances &gt; rowCapacity * total) {
        return {
          valid: false,
          message: `No es posible repartir ${totalAppearances} apariciones de semifijos: solo quedan ${rowCapacity * total} huecos después de los fijos.`
        };
      }

      const randomPoolSize = 49 - numberRules.length;
      const minimumSemiPerCombination = Math.max(0, 6 - fixedRules.length - randomPoolSize);
      if (totalAppearances &lt; minimumSemiPerCombination * total) {
        return {
          valid: false,
          message: &#x27;No quedan suficientes números libres para completar todas las combinaciones con estas reglas.&#x27;
        };
      }

      return {
        valid: true,
        message: positions.remaining === 0
          ? `Configuración posible: los criterios ocupan exactamente las ${positions.total} posiciones.`
          : `Configuración posible: quedan ${positions.remaining} posiciones para completar aleatoriamente.`
      };
    }

    function invalidateRuleGeneratedCombinations() {
      ruleGeneratedCombinations = [];
      copyRulesButton.disabled = true;
    }

    function renderNumberRules() {
      const total = getRuleCombinationTotal();
      ruleList.replaceChildren();

      if (numberRules.length === 0) {
        const empty = document.createElement(&#x27;li&#x27;);
        empty.className = &#x27;saved-empty&#x27;;
        empty.textContent = &#x27;No hay números seleccionados.&#x27;;
        ruleList.appendChild(empty);
      } else {
        numberRules
          .slice()
          .sort((first, second) =&gt; first.number - second.number)
          .forEach((rule) =&gt; {
            const originalIndex = numberRules.findIndex((candidate) =&gt; candidate.number === rule.number);
            const item = document.createElement(&#x27;li&#x27;);
            item.className = &#x27;rule-item&#x27;;

            const number = document.createElement(&#x27;span&#x27;);
            number.className = &#x27;viz-badge rule-number&#x27;;
            number.textContent = String(rule.number).padStart(2, &#x27;0&#x27;);

            const description = document.createElement(&#x27;span&#x27;);
            description.textContent = rule.type === &#x27;fixed&#x27;
              ? `Fijo · aparece en ${total === 1 ? &#x27;la combinación&#x27; : `las ${total}`}`
              : `Semifijo · aparece en ${rule.appearances} de ${total}`;

            const removeButton = document.createElement(&#x27;button&#x27;);
            removeButton.className = &#x27;btn btn-ghost&#x27;;
            removeButton.type = &#x27;button&#x27;;
            removeButton.dataset.removeRule = String(originalIndex);
            removeButton.textContent = &#x27;Quitar&#x27;;
            removeButton.setAttribute(&#x27;aria-label&#x27;, `Quitar el número ${rule.number}`);

            item.append(number, description, removeButton);
            ruleList.appendChild(item);
          });
      }

      clearRulesButton.disabled = numberRules.length === 0;
      generateTicketButton.disabled = !assessRuleConfiguration().valid;
      updateRulePositionSummary();
    }

    function addNumberRule() {
      const total = getRuleCombinationTotal();
      const number = Number(ruleNumberSelect.value);
      const type = ruleTypeSelect.value;
      const requestedAppearances = Math.trunc(Number(ruleFrequencySelect.value));
      const appearances = type === &#x27;fixed&#x27;
        ? total
        : Math.min(Math.max(1, Number.isInteger(requestedAppearances) ? requestedAppearances : 1), total);

      if (numberRules.some((rule) =&gt; rule.number === number)) {
        setRuleMessage(`El número ${number} ya está seleccionado.`, true);
        return;
      }

      if (type === &#x27;fixed&#x27; &amp;&amp; numberRules.filter((rule) =&gt; rule.type === &#x27;fixed&#x27;).length &gt;= 6) {
        setRuleMessage(&#x27;Se permiten como máximo 6 números fijos por combinación.&#x27;, true);
        return;
      }

      invalidateRuleGeneratedCombinations();
      numberRules.push({ number, type, appearances });
      renderNumberRules();
      const assessment = assessRuleConfiguration();
      const addedMessage = type === &#x27;fixed&#x27;
        ? `Número ${number} añadido como fijo.`
        : `Número ${number} añadido como semifijo en ${appearances} de ${total}.`;
      setRuleMessage(`${addedMessage} ${assessment.message}`, !assessment.valid);
    }

    function removeNumberRule(index) {
      if (!Number.isInteger(index) || index &lt; 0 || index &gt;= numberRules.length) return;
      invalidateRuleGeneratedCombinations();
      const removed = numberRules.splice(index, 1)[0];
      renderNumberRules();
      const assessment = assessRuleConfiguration();
      setRuleMessage(
        `Número ${removed.number} eliminado de las reglas. ${assessment.message}`,
        numberRules.length &gt; 0 &amp;&amp; !assessment.valid
      );
    }

    function clearNumberRules() {
      invalidateRuleGeneratedCombinations();
      numberRules = [];
      renderNumberRules();
      setRuleMessage(&#x27;Se han quitado todos los números fijos y semifijos.&#x27;);
    }

    function handleRuleTotalChange() {
      const total = getRuleCombinationTotal();
      ruleTotalSelect.value = String(total);
      let adjustedRules = 0;
      invalidateRuleGeneratedCombinations();
      numberRules.forEach((rule) =&gt; {
        if (rule.type === &#x27;fixed&#x27;) {
          rule.appearances = total;
        } else if (rule.appearances &gt; total) {
          rule.appearances = total;
          adjustedRules += 1;
        }
      });
      updateRuleQuantityControls();
      renderNumberRules();
      const assessment = assessRuleConfiguration();
      const adjustmentMessage = adjustedRules &gt; 0
        ? `Se han ajustado ${adjustedRules} ${adjustedRules === 1 ? &#x27;frecuencia&#x27; : &#x27;frecuencias&#x27;} al nuevo máximo. `
        : &#x27;&#x27;;
      setRuleMessage(`${adjustmentMessage}${assessment.message}`, numberRules.length &gt; 0 &amp;&amp; !assessment.valid);
    }

    function secureShuffle(values) {
      const shuffled = values.slice();
      for (let index = shuffled.length - 1; index &gt; 0; index -= 1) {
        const swapIndex = secureRandomIndex(index + 1);
        [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
      }
      return shuffled;
    }

    function scheduleScore(rows, semiRules, fixedCount, randomPoolSize) {
      const loads = rows.map((row) =&gt; row.length);
      const average = loads.reduce((total, load) =&gt; total + load, 0) / rows.length;
      let score = loads.reduce((total, load) =&gt; total + Math.abs(load - average), 0);
      const repeatedPatterns = new Map();

      rows.forEach((row) =&gt; {
        const key = row.slice().sort((first, second) =&gt; first - second).join(&#x27;,&#x27;);
        repeatedPatterns.set(key, (repeatedPatterns.get(key) || 0) + 1);
      });

      repeatedPatterns.forEach((repetitions, key) =&gt; {
        const semiCount = key === &#x27;&#x27; ? 0 : key.split(&#x27;,&#x27;).length;
        const randomNumbersNeeded = 6 - fixedCount - semiCount;
        const distinctCapacity = limitedCombinationCount(randomPoolSize, randomNumbersNeeded);
        if (repetitions &gt; distinctCapacity) {
          score += (repetitions - distinctCapacity) * 1000000;
        }
      });

      for (let first = 0; first &lt; semiRules.length; first += 1) {
        for (let second = first + 1; second &lt; semiRules.length; second += 1) {
          const firstNumber = semiRules[first].number;
          const secondNumber = semiRules[second].number;
          const overlap = rows.filter((row) =&gt; row.includes(firstNumber) &amp;&amp; row.includes(secondNumber)).length;
          const maximumOverlap = Math.min(semiRules[first].appearances, semiRules[second].appearances);
          if (overlap === 0) score += 4;
          if (overlap === maximumOverlap) score += 4;
        }
      }
      return score;
    }

    function createSemiSchedule(fixedRules, semiRules, total) {
      const rowCapacity = 6 - fixedRules.length;
      const totalAppearances = semiRules.reduce((total, rule) =&gt; total + rule.appearances, 0);
      const randomPoolSize = 49 - fixedRules.length - semiRules.length;
      const minimumSemiPerRow = Math.max(0, 6 - fixedRules.length - randomPoolSize);
      if (
        rowCapacity &lt; 0 ||
        totalAppearances &gt; rowCapacity * total ||
        totalAppearances &lt; minimumSemiPerRow * total ||
        semiRules.some((rule) =&gt; rule.appearances &gt; total)
      ) return null;
      if (rowCapacity === 0) return totalAppearances === 0 ? Array.from({ length: total }, () =&gt; []) : null;
      if (semiRules.length === 0) return Array.from({ length: total }, () =&gt; []);

      const orderedRules = semiRules.slice().sort((first, second) =&gt; second.appearances - first.appearances);
      let bestRows = null;
      let bestScore = Number.POSITIVE_INFINITY;
      const attempts = Math.min(240, 80 + semiRules.length * 4);

      for (let attempt = 0; attempt &lt; attempts; attempt += 1) {
        const rows = Array.from({ length: total }, () =&gt; []);
        let valid = true;

        for (const rule of orderedRules) {
          const availableRows = rows
            .map((row, index) =&gt; ({ index, load: row.length }))
            .filter((entry) =&gt; entry.load &lt; rowCapacity)
            .map((entry) =&gt; entry.index);

          if (availableRows.length &lt; rule.appearances) {
            valid = false;
            break;
          }

          secureShuffle(availableRows)
            .slice(0, rule.appearances)
            .forEach((rowIndex) =&gt; rows[rowIndex].push(rule.number));
        }

        if (!valid || rows.some((row) =&gt; row.length &lt; minimumSemiPerRow)) continue;
        const score = scheduleScore(rows, semiRules, fixedRules.length, randomPoolSize);
        if (score &lt; bestScore) {
          bestScore = score;
          bestRows = rows.map((row) =&gt; row.slice());
          if (score === 0) break;
        }
      }

      if (bestRows) return bestRows;

      const balancedRows = Array.from({ length: total }, () =&gt; []);
      for (const rule of orderedRules) {
        const availableRows = secureShuffle(
          balancedRows
            .map((row, index) =&gt; ({ index, load: row.length }))
            .filter((entry) =&gt; entry.load &lt; rowCapacity)
        )
          .sort((first, second) =&gt; first.load - second.load)
          .slice(0, rule.appearances);

        if (availableRows.length &lt; rule.appearances) return null;
        availableRows.forEach((entry) =&gt; balancedRows[entry.index].push(rule.number));
      }

      return balancedRows.some((row) =&gt; row.length &lt; minimumSemiPerRow) ? null : balancedRows;
    }

    function limitedCombinationCount(available, needed, limit = 101) {
      if (needed &lt; 0 || needed &gt; available) return 0;
      const chosen = Math.min(needed, available - needed);
      let count = 1;
      for (let step = 1; step &lt;= chosen; step += 1) {
        count = count * (available - chosen + step) / step;
        if (count &gt;= limit) return limit;
      }
      return Math.round(count);
    }

    function createUniqueRandomFillings(pool, needed, count) {
      if (count === 0) return [];
      if (needed === 0) return count === 1 ? [[]] : null;
      if (limitedCombinationCount(pool.length, needed, count) &lt; count) return null;

      const fillings = [];
      const used = new Set();
      const maximumAttempts = Math.max(1500, count * 350);
      for (let attempt = 0; attempt &lt; maximumAttempts &amp;&amp; fillings.length &lt; count; attempt += 1) {
        const filling = secureShuffle(pool)
          .slice(0, needed)
          .sort((first, second) =&gt; first - second);
        const key = filling.join(&#x27;,&#x27;);
        if (used.has(key)) continue;
        used.add(key);
        fillings.push(filling);
      }
      return fillings.length === count ? fillings : null;
    }

    function createCombinationsFromSchedule(fixedNumbers, schedule, reservedNumbers) {
      const reservedSet = new Set(reservedNumbers);
      const pool = Array.from({ length: 49 }, (_, index) =&gt; index + 1)
        .filter((number) =&gt; !reservedSet.has(number));
      const groups = new Map();

      schedule.forEach((semiNumbers, rowIndex) =&gt; {
        const required = [...fixedNumbers, ...semiNumbers].sort((first, second) =&gt; first - second);
        const key = required.join(&#x27;,&#x27;);
        if (!groups.has(key)) groups.set(key, { required, rowIndexes: [] });
        groups.get(key).rowIndexes.push(rowIndex);
      });

      const generated = Array.from({ length: schedule.length });
      for (const group of groups.values()) {
        const needed = 6 - group.required.length;
        const capacity = limitedCombinationCount(pool.length, needed);
        if (capacity &lt; group.rowIndexes.length) {
          return {
            combinations: null,
            message: `La regla ${group.required.join(&#x27;, &#x27;)} solo permite ${capacity} ${capacity === 1 ? &#x27;combinación distinta&#x27; : &#x27;combinaciones distintas&#x27;}, pero necesita ${group.rowIndexes.length}.`
          };
        }

        const fillings = createUniqueRandomFillings(pool, needed, group.rowIndexes.length);
        if (!fillings) {
          return {
            combinations: null,
            message: &#x27;No se han podido completar todas las combinaciones sin duplicados. Modifica alguna regla y vuelve a intentarlo.&#x27;
          };
        }

        group.rowIndexes.forEach((rowIndex, index) =&gt; {
          generated[rowIndex] = [...group.required, ...fillings[index]]
            .sort((first, second) =&gt; first - second);
        });
      }

      return { combinations: generated, message: &#x27;&#x27; };
    }

    async function generateTicketFromRules() {
      const total = getRuleCombinationTotal();
      if (savedCombinations.length &gt; 0) {
        setRuleMessage(&#x27;Vacía primero la lista de combinaciones guardadas.&#x27;, true);
        return;
      }

      const assessment = assessRuleConfiguration();
      if (!assessment.valid) {
        setRuleMessage(assessment.message, true);
        return;
      }

      const fixedRules = numberRules.filter((rule) =&gt; rule.type === &#x27;fixed&#x27;);
      const semiRules = numberRules.filter((rule) =&gt; rule.type === &#x27;semi&#x27;);
      const fixedNumbers = fixedRules.map((rule) =&gt; rule.number);
      const reservedNumbers = numberRules.map((rule) =&gt; rule.number);
      const automaticSearches = total &lt;= 30 ? 6 : 3;
      let schedule = null;
      let creation = null;

      for (let search = 0; search &lt; automaticSearches; search += 1) {
        const candidateSchedule = createSemiSchedule(fixedRules, semiRules, total);
        if (!candidateSchedule) continue;
        schedule = candidateSchedule;
        creation = createCombinationsFromSchedule(fixedNumbers, candidateSchedule, reservedNumbers);
        if (creation.combinations) break;
      }

      if (!schedule || !creation) {
        setRuleMessage(&#x27;Las apariciones seleccionadas no caben en combinaciones de 6 números. Reduce los fijos o las frecuencias.&#x27;, true);
        return;
      }

      if (!creation.combinations) {
        setRuleMessage(
          `${creation.message} Se han probado automáticamente varios repartos. Pulsa de nuevo «${generateTicketButton.textContent}» para iniciar otra búsqueda o reduce algunas apariciones para dejar posiciones aleatorias.`,
          true
        );
        return;
      }
      const generated = creation.combinations;

      busy = true;
      generateTicketButton.disabled = true;
      drawButton.disabled = true;
      resetButton.disabled = true;
      drum.classList.add(&#x27;is-mixing&#x27;);
      status.textContent = `El bombo está mezclando los números para ${combinationCountLabel(total)}…`;
      relocateBalls();
      await wait(reducedMotion ? 10 : 900);
      drum.classList.remove(&#x27;is-mixing&#x27;);
      busy = false;

      savedOrigin = &#x27;rules&#x27;;
      savedCombinations = generated;
      savedPageIndex = 0;
      ruleGeneratedCombinations = generated.map((combination) =&gt; combination.slice());
      copyRulesButton.disabled = false;
      drawn = generated[0].slice();
      remaining = Array.from({ length: 49 }, (_, index) =&gt; index + 1).filter((number) =&gt; !drawn.includes(number));
      createDrumBalls();
      drawn.forEach((number) =&gt; ballsContainer.querySelector(`[data-number=&quot;${number}&quot;]`)?.remove());
      relocateBalls();
      refreshResults();
      renderSavedCombinations();
      generateTicketButton.disabled = !assessRuleConfiguration().valid;
      setRuleMessage(`Generadas ${combinationCountLabel(total)} diferentes con el reparto solicitado.`);
      status.textContent = `Primera combinación del boleto · ${generated[0].join(&#x27;, &#x27;)}`;
      summary.textContent = `Se han generado y guardado ${combinationCountLabel(total)} con los números fijos y semifijos seleccionados.`;
    }

    function parseTxtCombinations(text) {
      const combinations = [];
      const errors = [];
      const seen = new Set();
      const lines = text.replace(/^\uFEFF/, &#x27;&#x27;).split(/\r?\n/);

      lines.forEach((rawLine, index) =&gt; {
        const lineNumber = index + 1;
        let line = rawLine.trim();
        if (!line || line.startsWith(&#x27;#&#x27;)) return;
        line = line.replace(/^\d+\s*[.)-]\s+/, &#x27;&#x27;).trim();

        let numbers;
        if (/^\d{12}$/.test(line)) {
          numbers = line.match(/\d{2}/g).map(Number);
        } else {
          const matches = line.match(/\d+/g) || [];
          numbers = matches.map(Number);
          if (matches.some((match) =&gt; match.length &gt; 2)) numbers = [];
        }

        if (numbers.length !== 6 || numbers.some((number) =&gt; number &lt; 1 || number &gt; 49) || new Set(numbers).size !== 6) {
          errors.push(lineNumber);
          return;
        }

        const combination = numbers.sort((first, second) =&gt; first - second);
        const key = combinationKey(combination);
        if (seen.has(key)) {
          errors.push(lineNumber);
          return;
        }
        seen.add(key);
        combinations.push(combination);
      });

      return { combinations, errors };
    }

    function readFileAsText(file) {
      return new Promise((resolve, reject) =&gt; {
        const reader = new FileReader();
        reader.addEventListener(&#x27;load&#x27;, () =&gt; resolve(String(reader.result || &#x27;&#x27;)));
        reader.addEventListener(&#x27;error&#x27;, () =&gt; reject(reader.error));
        reader.readAsText(file, &#x27;UTF-8&#x27;);
      });
    }

    function acceptImportedText(text, source) {
      resetImportedCombinations();

      if (text.length &gt; 1024 * 1024) {
        setTxtMessage(&#x27;El contenido supera el máximo de 1 MB.&#x27;, true);
        updateImportedControls();
        return false;
      }

      const result = parseTxtCombinations(text);
      if (result.errors.length &gt; 0) {
        const shownLines = result.errors.slice(0, 6).join(&#x27;, &#x27;);
        const extra = result.errors.length &gt; 6 ? &#x27;…&#x27; : &#x27;&#x27;;
        setTxtMessage(`No se ha cargado: revisa las líneas ${shownLines}${extra}. Cada línea debe tener 6 números distintos del 1 al 49.`, true);
        updateImportedControls();
        return false;
      }
      if (result.combinations.length === 0) {
        setTxtMessage(&#x27;No se han encontrado combinaciones válidas.&#x27;, true);
        updateImportedControls();
        return false;
      }
      if (result.combinations.length &gt; 1000) {
        setTxtMessage(&#x27;El contenido tiene más de 1000 combinaciones.&#x27;, true);
        updateImportedControls();
        return false;
      }

      importedCombinations = result.combinations;
      importedSource = source;
      generateTxtQrButton.disabled = false;
      updateTxtGuidance();
      updateImportedControls();
      const origin = source === &#x27;clipboard&#x27; ? &#x27;Texto pegado&#x27; : &#x27;Archivo cargado&#x27;;
      summary.textContent = `${origin} con ${importedCombinations.length} combinaciones válidas.`;
      return true;
    }

          return;

        const existingText = pastedCombinationsInput.value.trimEnd();

        pastedCombinationsInput.value = existingText
          ? `${existingText}\n${clipboardText}\n`
          : `${clipboardText}\n`;
        pastedCombinationsInput.setSelectionRange?.(
          pastedCombinationsInput.value.length,
          pastedCombinationsInput.value.length

        pastedCombinationsInput.focus();

      const preparedText = `${needsLeadingBreak ? &#x27;\n&#x27; : &#x27;&#x27;}${clipboardText.trim()}\n`;

    function exactCombinationCount(available, needed) {
      if (needed &lt; 0 || needed &gt; available) return 0;
      const chosen = Math.min(needed, available - needed);
      let count = 1;
      for (let step = 1; step &lt;= chosen; step += 1) {
        count = count * (available - chosen + step) / step;
      }
      return Math.round(count);
    }

    function getDevelopmentFeasibility(total, fixedTotal, mode, guarantee) {
      const caseTotal = total &gt;= 6
        ? exactCombinationCount(total - fixedTotal, 6 - fixedTotal)
        : 0;
      const technicalLimit = mode === &#x27;full&#x27;
        ? DEVELOPMENT_FULL_CASE_LIMIT
        : DEVELOPMENT_REDUCTION_CASE_LIMITS[guarantee] || DEVELOPMENT_REDUCTION_CASE_LIMITS[4];
      const mobileLikeDevice =
        window.matchMedia(&#x27;(max-width: 760px)&#x27;).matches ||
        window.matchMedia(&#x27;(pointer: coarse)&#x27;).matches;
      const limit = mobileLikeDevice
        ? Math.min(technicalLimit, DEVELOPMENT_MOBILE_CASE_LIMIT)
        : technicalLimit;
      const feasible = total &gt;= DEVELOPMENT_MIN_NUMBERS &amp;&amp;
        total &lt;= DEVELOPMENT_MAX_NUMBERS &amp;&amp;
        caseTotal &gt; 0 &amp;&amp;
        caseTotal &lt;= limit;
      const workload = caseTotal &lt;= DEVELOPMENT_DENSE_CASE_LIMIT
        ? &#x27;ligera&#x27;
        : caseTotal &lt;= 100000
          ? &#x27;moderada&#x27;
          : &#x27;alta&#x27;;
      return { caseTotal, limit, feasible, workload };
    }

    function updateDevelopmentModeGuidance(prefix = &#x27;&#x27;) {

    function toggleDevelopmentNumber(number) {
      if (developmentBusy || !Number.isInteger(number) || number &lt; 1 || number &gt; 49) return;
      const selectedIndex = developmentSelectedNumbers.indexOf(number);
      const fixedIndex = developmentFixedNumbers.indexOf(number);

        developmentSelectedNumbers.splice(selectedIndex, 1);
      } else if (selectedIndex &gt;= 0) {

    function selectRandomDevelopmentNumbers() {
      const requested = Math.trunc(Number(developmentRandomTotalInput.value));
      const total = Math.min(
        DEVELOPMENT_MAX_NUMBERS,
        Math.max(DEVELOPMENT_MIN_NUMBERS, Number.isInteger(requested) ? requested : DEVELOPMENT_MIN_NUMBERS)
      );
      developmentRandomTotalInput.value = String(total);
      developmentSelectedNumbers = secureShuffle(
        Array.from({ length: 49 }, (_, index) =&gt; index + 1)
      )
        .slice(0, total)
        .sort((first, second) =&gt; first - second);
      developmentFixedNumbers = [];
      invalidateDevelopmentResults();
      refreshDevelopmentControls();
      updateDevelopmentModeGuidance(`${total} números elegidos al azar.`);

    function clearDevelopmentNumbers() {
      if (developmentBusy) return;
      developmentSelectedNumbers = [];
      developmentFixedNumbers = [];
      invalidateDevelopmentResults(&#x27;Se han eliminado los números seleccionados y la reducción o desarrollo generado.&#x27;);
      scrutinyOutput.hidden = true;
      summary.textContent = &#x27;Generador y reductor limpiados.&#x27;;
      refreshDevelopmentControls();
    }

    function createSixNumberEntries(numbers, fixedNumbers = []) {
      const entries = [];
      const fixedSet = new Set(fixedNumbers);
      const fixedIndices = numbers
        .map((number, index) =&gt; fixedSet.has(number) ? index : -1)
        .filter((index) =&gt; index &gt;= 0);
      const availableIndices = numbers
        .map((number, index) =&gt; fixedSet.has(number) ? -1 : index)
        .filter((index) =&gt; index &gt;= 0);
      const needed = 6 - fixedIndices.length;
      if (needed &lt; 0 || needed &gt; availableIndices.length) return entries;
      const positions = new Array(needed);
      let baseLow = 0;
      let baseHigh = 0;
      fixedIndices.forEach((index) =&gt; {
        if (index &lt; 32) baseLow |= 1 &lt;&lt; index;
        else baseHigh |= 1 &lt;&lt; (index - 32);
      });
      const visit = (depth, start, maskLow, maskHigh) =&gt; {
        if (depth === needed) {
          const indices = fixedIndices.concat(positions).sort((first, second) =&gt; first - second);
          entries.push({
            indices,
            mask: maskLow,
            maskLow: maskLow &gt;&gt;&gt; 0,
            maskHigh: maskHigh &gt;&gt;&gt; 0,
            maskKey: `${maskLow &gt;&gt;&gt; 0}:${maskHigh &gt;&gt;&gt; 0}`,
            combination: indices.map((index) =&gt; numbers[index])
          });
          return;
        }
        const remainingPlaces = needed - depth;
        for (let position = start; position &lt;= availableIndices.length - remainingPlaces; position += 1) {
          const index = availableIndices[position];
          positions[depth] = index;
          visit(
            depth + 1,
            position + 1,
            index &lt; 32 ? maskLow | (1 &lt;&lt; index) : maskLow,
            index &gt;= 32 ? maskHigh | (1 &lt;&lt; (index - 32)) : maskHigh
          );
        }
      };
      visit(0, 0, baseLow, baseHigh);
      return entries;
    }

    function createDevelopmentEntryFromCombination(numbers, combination) {
      const indices = combination
        .map((number) =&gt; numbers.indexOf(number))
        .sort((first, second) =&gt; first - second);
      if (indices.length !== 6 || indices.some((index) =&gt; index &lt; 0)) {
        throw new Error(&#x27;La reducción guardada no coincide con los números seleccionados.&#x27;);
      }
      let maskLow = 0;
      let maskHigh = 0;
      indices.forEach((index) =&gt; {
        if (index &lt; 32) maskLow |= 1 &lt;&lt; index;
        else maskHigh |= 1 &lt;&lt; (index - 32);
      });
      return {
        indices,
        mask: maskLow,
        maskLow: maskLow &gt;&gt;&gt; 0,
        maskHigh: maskHigh &gt;&gt;&gt; 0,
        maskKey: `${maskLow &gt;&gt;&gt; 0}:${maskHigh &gt;&gt;&gt; 0}`,
        combination: combination.slice()
      };
    }

    function popcount32(value) {
      let current = value &gt;&gt;&gt; 0;
      current -= (current &gt;&gt;&gt; 1) &amp; 0x55555555;
      current = (current &amp; 0x33333333) + ((current &gt;&gt;&gt; 2) &amp; 0x33333333);
      return (((current + (current &gt;&gt;&gt; 4)) &amp; 0x0f0f0f0f) * 0x01010101) &gt;&gt;&gt; 24;
    }

    function developmentEntryHits(firstEntry, secondEntry) {
      return popcount32(firstEntry.maskLow &amp; secondEntry.maskLow) +
        popcount32(firstEntry.maskHigh &amp; secondEntry.maskHigh);
    }

    function forEachBitsetIndex(bitset, maximum, callback) {
      for (let wordIndex = 0; wordIndex &lt; bitset.length; wordIndex += 1) {
        let bits = bitset[wordIndex] &gt;&gt;&gt; 0;
        while (bits !== 0) {
          const lowestBit = (bits &amp; -bits) &gt;&gt;&gt; 0;
          const offset = 31 - Math.clz32(lowestBit);
          const index = wordIndex * 32 + offset;
          if (index &lt; maximum) callback(index);
          bits = (bits ^ lowestBit) &gt;&gt;&gt; 0;
        }
      }
    }

    function createFullBitset(total) {
      const bitset = new Uint32Array(Math.ceil(total / 32));
      for (let index = 0; index &lt; total; index += 1) {
        bitset[index &gt;&gt;&gt; 5] |= 1 &lt;&lt; (index &amp; 31);
      }
      return bitset;
    }

    function bitsetScore(bitset, uncovered) {
      let score = 0;
      for (let wordIndex = 0; wordIndex &lt; uncovered.length; wordIndex += 1) {
        score += popcount32(bitset[wordIndex] &amp; uncovered[wordIndex]);
      }
      return score;
    }

    function removeCovered(uncovered, coverage) {
      for (let wordIndex = 0; wordIndex &lt; uncovered.length; wordIndex += 1) {
        uncovered[wordIndex] = (uncovered[wordIndex] &amp; ~coverage[wordIndex]) &gt;&gt;&gt; 0;
      }
    }

    function bitsetIsEmpty(bitset) {
      return bitset.every((word) =&gt; word === 0);
    }

    function mergeCoverage(target, source) {
      for (let wordIndex = 0; wordIndex &lt; target.length; wordIndex += 1) {
        target[wordIndex] |= source[wordIndex];
      }
    }

    async function buildDevelopmentCoverage(candidateEntries, winningEntries, guarantee) {
      const candidateTotal = candidateEntries.length;
      const universeTotal = winningEntries.length;
      const words = Math.ceil(universeTotal / 32);
      const coverage = Array.from({ length: candidateTotal }, () =&gt; new Uint32Array(words));
      const symmetricUniverse = candidateEntries === winningEntries;
      for (let first = 0; first &lt; candidateTotal; first += 1) {
        const start = symmetricUniverse ? first : 0;
        for (let second = start; second &lt; universeTotal; second += 1) {
          if (developmentEntryHits(candidateEntries[first], winningEntries[second]) &lt; guarantee) continue;
          coverage[first][second &gt;&gt;&gt; 5] |= 1 &lt;&lt; (second &amp; 31);
          if (symmetricUniverse) {
            coverage[second][first &gt;&gt;&gt; 5] |= 1 &lt;&lt; (first &amp; 31);
          }
        }
        if (first % 48 === 47) {
          const progress = Math.round(((first + 1) / candidateTotal) * 100);
          setDevelopmentMessage(`Preparando la comprobación matemática… ${progress} %`);
          await wait(0);
        }
      }
      return coverage;
    }

    function createSeededRandom(seed) {
      let state = seed &gt;&gt;&gt; 0;
      return () =&gt; {
        state = (Math.imul(state, 1664525) + 1013904223) &gt;&gt;&gt; 0;
        return state / 4294967296;
      };
    }

    function shuffleWithRandom(values, random) {
      const result = values.slice();
      for (let index = result.length - 1; index &gt; 0; index -= 1) {
        const swapIndex = Math.floor(random() * (index + 1));
        [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
      }
      return result;
    }

    function chooseBestCoverage(coverages, uncovered, excluded, random) {
      let bestScore = -1;
      let selectedIndex = -1;
      let equalBestTotal = 0;
      for (let index = 0; index &lt; coverages.length; index += 1) {
        if (excluded?.[index]) continue;
        const score = bitsetScore(coverages[index], uncovered);
        if (score &gt; bestScore) {
          bestScore = score;
          selectedIndex = index;
          equalBestTotal = 1;
        } else if (score === bestScore &amp;&amp; score &gt; 0) {
          equalBestTotal += 1;
          if (random() &lt; 1 / equalBestTotal) selectedIndex = index;
        }
      }
      return { index: selectedIndex, score: bestScore };
    }

    function pruneSelectedItems(selected, coverages, universeTotal, targetCount, random) {
      const coverageCounts = new Uint16Array(universeTotal);
      selected.forEach((selectedIndex) =&gt; {
        forEachBitsetIndex(coverages[selectedIndex], universeTotal, (coveredIndex) =&gt; {
          coverageCounts[coveredIndex] += 1;
        });
      });

      let coveredTotal = coverageCounts.reduce((total, count) =&gt; total + (count &gt; 0 ? 1 : 0), 0);
      const retained = new Set(selected);
      shuffleWithRandom(selected, random).forEach((selectedIndex) =&gt; {
        let lostCases = 0;
        forEachBitsetIndex(coverages[selectedIndex], universeTotal, (coveredIndex) =&gt; {
          if (coverageCounts[coveredIndex] === 1) lostCases += 1;
        });
        if (coveredTotal - lostCases &lt; targetCount) return;
        retained.delete(selectedIndex);
        forEachBitsetIndex(coverages[selectedIndex], universeTotal, (coveredIndex) =&gt; {
          coverageCounts[coveredIndex] -= 1;
        });
        coveredTotal -= lostCases;
      });
      return selected.filter((selectedIndex) =&gt; retained.has(selectedIndex));
    }

    async function createRandomReduction(coverage, random, universeTotal, targetCount, cycleProgress = null) {
      const candidateTotal = coverage.length;
      const uncovered = createFullBitset(universeTotal);
      const used = new Uint8Array(candidateTotal);
      const selected = [];
      let coveredTotal = 0;
      while (coveredTotal &lt; targetCount) {
        const best = chooseBestCoverage(coverage, uncovered, used, random);
        if (best.index &lt; 0 || best.score &lt;= 0) throw new Error(&#x27;No se ha podido completar la cobertura.&#x27;);
        used[best.index] = 1;
        selected.push(best.index);
        coveredTotal += best.score;
        removeCovered(uncovered, coverage[best.index]);
        if (selected.length % 4 === 0) {
          const provisionalPercentage = universeTotal === 0 ? 0 : coveredTotal / universeTotal * 100;
          setDevelopmentMessage(
            cycleProgress
              ? `Ciclo ${cycleProgress.cycle} en curso · mejor B=${cycleProgress.best ?? &#x27;—&#x27;} · ${cycleProgress.stagnant} sin mejora · ${selected.length} apuestas provisionales · ${formatDevelopmentPercentage(provisionalPercentage)} cubierto.`
              : `Construyendo la reducción aleatoria… ${selected.length} apuestas provisionales · ${formatDevelopmentPercentage(provisionalPercentage)} cubierto.`
          );
          await wait(0);
        }
      }
      return pruneSelectedItems(selected, coverage, universeTotal, targetCount, random);
    }

    function rotateDevelopmentMask(mask, shift, size) {
      if (shift % size === 0) return mask;
      const normalized = shift % size;
      const limit = (1 &lt;&lt; size) - 1;
      return ((mask &lt;&lt; normalized) | (mask &gt;&gt;&gt; (size - normalized))) &amp; limit;
    }

    function createCycleGroups(entries, size, coverage, random) {
      const positionOrder = shuffleWithRandom(
        Array.from({ length: size }, (_, index) =&gt; index),
        random
      );
      const maskToIndex = new Map(entries.map((entry, index) =&gt; [entry.mask, index]));
      const assigned = new Uint8Array(entries.length);
      const words = Math.ceil(entries.length / 32);
      const groups = [];

      const toCycleMask = (originalMask) =&gt; positionOrder.reduce(
        (cycleMask, originalPosition, cyclePosition) =&gt;
          originalMask &amp; (1 &lt;&lt; originalPosition) ? cycleMask | (1 &lt;&lt; cyclePosition) : cycleMask,
        0
      );
      const fromCycleMask = (cycleMask) =&gt; positionOrder.reduce(
        (originalMask, originalPosition, cyclePosition) =&gt;
          cycleMask &amp; (1 &lt;&lt; cyclePosition) ? originalMask | (1 &lt;&lt; originalPosition) : originalMask,
        0
      );

      for (let entryIndex = 0; entryIndex &lt; entries.length; entryIndex += 1) {
        if (assigned[entryIndex]) continue;
        const cycleMask = toCycleMask(entries[entryIndex].mask);
        const indices = [];
        const uniqueIndices = new Set();
        for (let shift = 0; shift &lt; size; shift += 1) {
          const originalMask = fromCycleMask(rotateDevelopmentMask(cycleMask, shift, size));
          const rotatedIndex = maskToIndex.get(originalMask);
          if (rotatedIndex !== undefined &amp;&amp; !uniqueIndices.has(rotatedIndex)) {
            uniqueIndices.add(rotatedIndex);
            indices.push(rotatedIndex);
          }
        }
        indices.forEach((index) =&gt; {
          assigned[index] = 1;
        });
        const groupCoverage = new Uint32Array(words);
        indices.forEach((index) =&gt; mergeCoverage(groupCoverage, coverage[index]));
        groups.push({ indices, coverage: groupCoverage });
      }
      return groups;
    }

    async function createCycleReduction(entries, coverage, random, universeTotal, targetCount) {
      const groups = createCycleGroups(entries, developmentSelectedNumbers.length, coverage, random);
      const groupCoverages = groups.map((group) =&gt; group.coverage);
      const uncovered = createFullBitset(universeTotal);
      const used = new Uint8Array(groups.length);
      const selectedGroups = [];
      let coveredTotal = 0;
      while (coveredTotal &lt; targetCount) {
        const best = chooseBestCoverage(groupCoverages, uncovered, used, random);
        if (best.index &lt; 0 || best.score &lt;= 0) throw new Error(&#x27;No se ha podido completar la cobertura por ciclos.&#x27;);
        used[best.index] = 1;
        selectedGroups.push(best.index);
        coveredTotal += best.score;
        removeCovered(uncovered, groupCoverages[best.index]);
        if (selectedGroups.length % 3 === 0) {
          setDevelopmentMessage(`Construyendo la reducción por ciclos… ${selectedGroups.length} ciclos provisionales.`);
          await wait(0);
        }
      }
      const retainedGroups = pruneSelectedItems(selectedGroups, groupCoverages, universeTotal, targetCount, random);
      const ticketIndices = retainedGroups.flatMap((groupIndex) =&gt; groups[groupIndex].indices);
      return {
        ticketIndices: [...new Set(ticketIndices)],
        cycleTotal: retainedGroups.length
      };
    }

    async function createHybridReduction(entries, coverage, random, universeTotal, targetCount) {
      let bestIndices = null;
      let bestCoveredTotal = 0;
      let completedCycles = 0;
      let stagnantCycles = 0;
      do {
        completedCycles += 1;
        const candidateIndices = await createRandomReduction(coverage, random, universeTotal, targetCount, {
          cycle: completedCycles,
          best: bestIndices?.length ?? null,
          stagnant: stagnantCycles
        });
        const candidateVerification = verifyDevelopmentReduction(
          candidateIndices,
          coverage,
          universeTotal,
          targetCount
        );
        if (
          bestIndices === null ||
          candidateIndices.length &lt; bestIndices.length ||
          (candidateIndices.length === bestIndices.length &amp;&amp; candidateVerification.coveredTotal &gt; bestCoveredTotal)
        ) {
          bestIndices = candidateIndices.slice();
          bestCoveredTotal = candidateVerification.coveredTotal;
          stagnantCycles = 0;
        } else {
          stagnantCycles += 1;
          if (
            candidateIndices.length === bestIndices.length &amp;&amp;
            candidateVerification.coveredTotal === bestCoveredTotal &amp;&amp;
            random() &lt; 0.5
          ) {
            bestIndices = candidateIndices.slice();
          }
        }
        setDevelopmentMessage(
          `Ciclo ${completedCycles} · mejor resultado B=${bestIndices.length} · cobertura ${formatDevelopmentPercentage(bestCoveredTotal / universeTotal * 100)} · ${stagnantCycles} ${stagnantCycles === 1 ? &#x27;ciclo sin mejora&#x27; : &#x27;ciclos sin mejora&#x27;}.`
        );
        await wait(0);
      } while (!developmentStopRequested);
      return {
        ticketIndices: bestIndices || [],
        completedCycles,
        stagnantCycles
      };
    }

    async function createSparseRandomReduction(
      candidateEntries,
      winningEntries,
      guarantee,
      random,
      targetCount,
      cycleProgress = null
    ) {
      const universeTotal = winningEntries.length;
      const coverageCounts = new Uint16Array(universeTotal);
      const selectedRecords = [];
      let coveredTotal = 0;

      const findUncoveredIndex = () =&gt; {
        const start = Math.floor(random() * universeTotal);
        for (let offset = 0; offset &lt; universeTotal; offset += 1) {
          const index = (start + offset) % universeTotal;
          if (coverageCounts[index] === 0) return index;
        }
        return -1;
      };

      while (coveredTotal &lt; targetCount) {
        const ticketIndex = findUncoveredIndex();
        if (ticketIndex &lt; 0) break;
        const ticketEntry = candidateEntries[ticketIndex];
        const coveredIndices = [];
        for (let winningIndex = 0; winningIndex &lt; universeTotal; winningIndex += 1) {
          if (developmentEntryHits(ticketEntry, winningEntries[winningIndex]) &gt;= guarantee) {
            coveredIndices.push(winningIndex);
          }
        }
        coveredIndices.forEach((winningIndex) =&gt; {
          if (coverageCounts[winningIndex] === 0) coveredTotal += 1;
          coverageCounts[winningIndex] += 1;
        });
        selectedRecords.push({ index: ticketIndex, coveredIndices });
        if (selectedRecords.length % 4 === 0) {
          const provisionalPercentage = universeTotal === 0 ? 0 : coveredTotal / universeTotal * 100;
          setDevelopmentMessage(
            cycleProgress
              ? `Ciclo ${cycleProgress.cycle} en curso · mejor B=${cycleProgress.best ?? &#x27;—&#x27;} · ${selectedRecords.length} apuestas provisionales · ${formatDevelopmentPercentage(provisionalPercentage)} cubierto.`
              : `Cálculo avanzado en curso… ${selectedRecords.length} apuestas provisionales · ${formatDevelopmentPercentage(provisionalPercentage)} cubierto.`
          );
          await wait(0);
        }
      }

      const retained = new Set(selectedRecords.map((record) =&gt; record.index));
      const pruningOrder = shuffleWithRandom(selectedRecords, random);
      for (let recordIndex = 0; recordIndex &lt; pruningOrder.length; recordIndex += 1) {
        const record = pruningOrder[recordIndex];
        let lostCases = 0;
        record.coveredIndices.forEach((winningIndex) =&gt; {
          if (coverageCounts[winningIndex] === 1) lostCases += 1;
        });
        if (coveredTotal - lostCases &gt;= targetCount) {
          retained.delete(record.index);
          record.coveredIndices.forEach((winningIndex) =&gt; {
            coverageCounts[winningIndex] -= 1;
          });
          coveredTotal -= lostCases;
        }
        if (recordIndex % 24 === 23) await wait(0);
      }

      return {
        ticketIndices: selectedRecords
          .map((record) =&gt; record.index)
          .filter((index) =&gt; retained.has(index)),
        coveredTotal
      };
    }

    async function createSparseHybridReduction(
      candidateEntries,
      winningEntries,
      guarantee,
      random,
      targetCount
    ) {
      let bestIndices = null;
      let bestCoveredTotal = 0;
      let completedCycles = 0;
      let stagnantCycles = 0;
      do {
        completedCycles += 1;
        const candidateResult = await createSparseRandomReduction(
          candidateEntries,
          winningEntries,
          guarantee,
          random,
          targetCount,
          {
            cycle: completedCycles,
            best: bestIndices?.length ?? null,
            stagnant: stagnantCycles
          }
        );
        if (
          bestIndices === null ||
          candidateResult.ticketIndices.length &lt; bestIndices.length ||
          (
            candidateResult.ticketIndices.length === bestIndices.length &amp;&amp;
            candidateResult.coveredTotal &gt; bestCoveredTotal
          )
        ) {
          bestIndices = candidateResult.ticketIndices.slice();
          bestCoveredTotal = candidateResult.coveredTotal;
          stagnantCycles = 0;
        } else {
          stagnantCycles += 1;
        }
        setDevelopmentMessage(
          `Ciclo ${completedCycles} · mejor resultado B=${bestIndices.length} · cobertura ${formatDevelopmentPercentage(bestCoveredTotal / winningEntries.length * 100)} · ${stagnantCycles} ${stagnantCycles === 1 ? &#x27;ciclo sin mejora&#x27; : &#x27;ciclos sin mejora&#x27;}.`
        );
        await wait(0);
      } while (!developmentStopRequested);
      return {
        ticketIndices: bestIndices || [],
        coveredTotal: bestCoveredTotal,
        completedCycles,
        stagnantCycles
      };
    }

    function verifyDevelopmentReduction(selectedIndices, coverage, universeTotal, targetCount = universeTotal) {
      const covered = new Uint32Array(Math.ceil(universeTotal / 32));
      selectedIndices.forEach((index) =&gt; mergeCoverage(covered, coverage[index]));
      let coveredTotal = 0;
      covered.forEach((word) =&gt; {
        coveredTotal += popcount32(word);
      });
      return {
        valid: coveredTotal &gt;= targetCount,
        coveredTotal,
        coveragePercentage: universeTotal === 0 ? 0 : coveredTotal / universeTotal * 100
      };
    }

    async function calculateDevelopmentPrizeBreakdown(winningEntries, ticketEntries, options = {}) {
      const groups = Array.from({ length: 7 }, () =&gt; ({
        cases: 0,
        minimums: Array(7).fill(Infinity),
        maximums: Array(7).fill(0)
      }));
      const yieldEvery = Math.max(
        1,
        Math.min(512, Math.floor(250000 / Math.max(1, ticketEntries.length)))
      );

      for (let winningIndex = 0; winningIndex &lt; winningEntries.length; winningIndex += 1) {
        const winningEntry = winningEntries[winningIndex];
        const prizesByHits = Array(7).fill(0);
        ticketEntries.forEach((ticketEntry) =&gt; {
          const hits = developmentEntryHits(winningEntry, ticketEntry);
          prizesByHits[hits] += 1;
        });
        let bestHits = 6;
        while (bestHits &gt; 0 &amp;&amp; prizesByHits[bestHits] === 0) bestHits -= 1;
        const group = groups[bestHits];
        group.cases += 1;
        for (let hits = 0; hits &lt;= 6; hits += 1) {
          group.minimums[hits] = Math.min(group.minimums[hits], prizesByHits[hits]);
          group.maximums[hits] = Math.max(group.maximums[hits], prizesByHits[hits]);
        }
        if (
          winningIndex % yieldEvery === yieldEvery - 1 ||
          winningIndex === winningEntries.length - 1
        ) {
          if (options.shouldCancel?.()) {
            const cancellationError = new Error(&#x27;BREAKDOWN_CANCELLED&#x27;);
            cancellationError.code = &#x27;BREAKDOWN_CANCELLED&#x27;;
            throw cancellationError;
          }
          options.onProgress?.(
            Math.min(100, Math.round((winningIndex + 1) / winningEntries.length * 100))
          );
          await wait(0);
        }
      }

      let cumulativeCases = 0;
      return Array.from({ length: 7 }, (_, index) =&gt; 6 - index).map((guarantee) =&gt; {
        const group = groups[guarantee];
        cumulativeCases += group.cases;
        return {
          guarantee,
          cases: group.cases,
          coverage: winningEntries.length === 0 ? 0 : cumulativeCases / winningEntries.length * 100,
          ranges: Array.from({ length: 7 }, (_, index) =&gt; 6 - index).map((hits) =&gt; {
            if (group.cases === 0) return &#x27;—&#x27;;
            return `${group.minimums[hits]}–${group.maximums[hits]}`;
          })
        };
      });
    }

      rows.forEach((rowData) =&gt; {

        const values = [
          rowData.cases.toLocaleString(&#x27;es-ES&#x27;),
          formatDevelopmentPercentage(rowData.coverage),
          `${rowData.guarantee} si 6`,
          ...rowData.ranges
        ];
        values.forEach((value) =&gt; {

        developmentBreakdownNote.textContent =
          &#x27;Este desglose general complementa la garantía condicionada. La cobertura es acumulada y no incluye complementario, reintegro ni Joker.&#x27;;
      } else {

          &#x27;Casos posibles al acertar los 6 números seleccionados y cantidad mínima–máxima de apuestas premiadas en la reducción.&#x27;;
        developmentBreakdownNote.textContent =
          &#x27;La cobertura es acumulada: por ejemplo, «5 si 6» incluye todos los casos con al menos 5 aciertos. No se incluyen complementario, reintegro ni Joker.&#x27;;
      }
